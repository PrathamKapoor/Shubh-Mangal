# Replace residency.example.invalid with the confirmed domain. Obtain TLS certificates first.
# Use this server behind your existing TLS configuration, or configure certbot as documented.
server {
    listen 80;
    server_name residency.example.invalid;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name residency.example.invalid;
    ssl_certificate /etc/letsencrypt/live/residency.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/residency.example.invalid/privkey.pem;
    # The application still caps JSON at 256 KB; reviewed image uploads allow 2 MB.
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
